<!-- AI-assisted: written with Anthropic Claude under the direction of the team. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <!-- The chosen theme (light unless the viewer picked dark), applied before the first paint. -->
    <script>
      try { if (localStorage.getItem('theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) { /* no storage: light */ }
    </script>
    <meta
      name="description"
      content="Compare lunar landing sites and dates: Sun and Earth positions relative to the local horizon, for solar power and direct-to-Earth communication."
    />
    <title>Lunar Landing Site Navigator</title>
    <!-- No icon yet: an empty one keeps browsers from requesting a favicon.ico that does not exist. -->
    <link rel="icon" href="data:," />
  </head>
  <body>
    <div id="app"></div>
    <noscript>This application needs JavaScript to compute Sun and Earth positions in your browser.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
